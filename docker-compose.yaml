services:
  unc-trivia-database:
    image: postgres:latest
    env_file: .env
    container_name: $POSTGRES_HOST
    environment: 
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_PORT: $POSTGRES_PORT
    expose:
      - $POSTGRES_PORT
    volumes:
      - pgdata:/var/lib/postgresql/
    networks:
      - fullstack
    
  unc-trivia-api:
    build: .
    container_name: "unc-trivia_api"
    env_file: .env
    depends_on: 
      - unc-trivia-database
    ports:
      - $API_PORT:$API_PORT
    networks:
      - fullstack

  unc-trivia-adminer:
    container_name: "adminer"
    image: adminer
    env_file: .env
    ports:
      - 8080:8080
    networks:
      - fullstack

volumes:
  pgdata:

networks:
  fullstack:
    driver: bridge
